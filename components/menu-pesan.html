<section id="panel-pesan">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-comments me-1 text-primary"></i> Kotak Pesan & Konsultasi Langsung</h6>
        <small class="text-muted">Kirim pertanyaan atau konsultasi langsung ke Wali Kelas</small>
      </div>
      <button class="btn btn-primary btn-sm" onclick="bukaModalKirimPesan()">
        <i class="fa-solid fa-paper-plane me-1"></i> Kirim Pesan Baru
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45px;">No</th>
            <th>Waktu</th>
            <th>Pengirim</th>
            <th>Tujuan</th>
            <th>Isi Pesan</th>
          </tr>
        </thead>
        <tbody id="table-pesan-body">
          <tr><td colspan="5" class="text-center text-muted py-4">Memuat pesan...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal Kirim Pesan -->
<div class="modal fade" id="modalKirimPesan" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h6 class="modal-title fw-bold">Tulis Pesan ke Wali Kelas</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <form id="form-pesan" onsubmit="submitFormPesan(event)">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Pesan / Pertanyaan Anda</label>
            <textarea id="msg-isi" class="form-control form-control-sm" rows="4" required placeholder="Tuliskan pesan konsultasi..."></textarea>
          </div>
          <button type="submit" id="btn-save-msg" class="btn btn-primary btn-sm w-100">Kirim Pesan</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  async function loadDataPesan() {
    const tbody = document.getElementById('table-pesan-body');
    try {
      const res = await postGAS({ action: 'getDataPesan' });
      if (res.status === 'success') {
        tbody.innerHTML = '';
        if (res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada riwayat pesan.</td></tr>';
          return;
        }
        res.data.forEach((p, idx) => {
          tbody.innerHTML += `
            <tr>
              <td>${idx + 1}</td>
              <td><small class="text-muted">${(p.timestamp || '').toString().slice(0, 16)}</small></td>
              <td class="fw-semibold">${p.sender_id}</td>
              <td>${p.receiver_id}</td>
              <td><small class="text-secondary">${p.pesan}</small></td>
            </tr>
          `;
        });
      }
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center">Gagal memuat pesan.</td></tr>';
    }
  }

  function bukaModalKirimPesan() {
    document.getElementById('form-pesan').reset();
    new bootstrap.Modal(document.getElementById('modalKirimPesan')).show();
  }

  async function submitFormPesan(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save-msg');
    btn.innerText = 'Mengirim...';
    btn.disabled = true;

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({
        action: 'savePesan',
        user_id: session.user_id,
        payload: {
          receiver_id: 'WALI_KELAS',
          pesan: document.getElementById('msg-isi').value.trim()
        }
      });
      alert(res.message);
      if (res.status === 'success') {
        bootstrap.Modal.getInstance(document.getElementById('modalKirimPesan')).hide();
        loadDataPesan();
      }
    } catch (err) {
      alert('Gagal mengirim pesan.');
    } finally {
      btn.innerText = 'Kirim Pesan';
      btn.disabled = false;
    }
  }

  loadDataPesan();
</script>
