<section id="panel-presensi">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="small fw-semibold text-secondary">Tanggal:</label>
        <input type="date" id="presensi-date" class="form-control form-control-sm" style="width: 150px;" onchange="loadPresensiMassal()">
        <button class="btn btn-outline-secondary btn-sm" onclick="setSemuaHadir()">
          <i class="fa-solid fa-check-double me-1 text-success"></i> Set Semua Hadir
        </button>
      </div>
      <div class="d-flex gap-2" id="presensi-action-buttons">
        <button class="btn btn-outline-success btn-sm" onclick="downloadTemplatePresensi()">
          <i class="fa-solid fa-download me-1"></i> Template Excel
        </button>
        <button class="btn btn-outline-primary btn-sm" onclick="bukaModalImportPresensi()">
          <i class="fa-solid fa-file-import me-1"></i> Import Excel
        </button>
        <button id="btn-save-presensi" class="btn btn-success btn-sm px-3" onclick="simpanPresensiMassal()">
          <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi
        </button>
      </div>
    </div>

    <!-- Ringkasan Angka Rekap Cepat -->
    <div class="row g-2 mb-3 text-center small">
      <div class="col-3">
        <div class="p-2 border rounded bg-success-subtle text-success fw-bold">
          Hadir: <span id="count-h">0</span>
        </div>
      </div>
      <div class="col-3">
        <div class="p-2 border rounded bg-warning-subtle text-warning-emphasis fw-bold">
          Sakit: <span id="count-s">0</span>
        </div>
      </div>
      <div class="col-3">
        <div class="p-2 border rounded bg-info-subtle text-info fw-bold">
          Izin: <span id="count-i">0</span>
        </div>
      </div>
      <div class="col-3">
        <div class="p-2 border rounded bg-danger-subtle text-danger fw-bold">
          Alfa: <span id="count-a">0</span>
        </div>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45px;" class="text-center">No</th>
            <th>NIS</th>
            <th>Nama Siswa</th>
            <th style="width: 260px;" class="text-center">Status Kehadiran</th>
            <th>Keterangan Tambahan</th>
          </tr>
        </thead>
        <tbody id="table-presensi-body">
          <tr>
            <td colspan="5" class="text-center text-muted py-4">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data siswa...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal Import Presensi Excel -->
<div class="modal fade" id="modalImportPresensi" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title fw-bold"><i class="fa-solid fa-file-import me-2"></i>Import Presensi via Excel</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <p class="small text-muted mb-2">
          Format kolom wajib: <strong>nis</strong>, <strong>tanggal</strong> (YYYY-MM-DD), <strong>status_kehadiran</strong> (H / S / I / A), dan <strong>keterangan</strong>.
        </p>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Pilih Berkas Excel (.xlsx / .xls)</label>
          <input type="file" id="file-import-presensi" class="form-control form-control-sm" accept=".xlsx, .xls">
        </div>
        <button type="button" id="btn-proses-import-pres" class="btn btn-success btn-sm w-100" onclick="prosesImportExcelPresensi()">
          Mulai Import Presensi
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  var cacheDaftarSiswaPresensi = [];

  async function initPresensi() {
    var inputTgl = document.getElementById('presensi-date');
    if (!inputTgl.value) {
      inputTgl.value = new Date().toISOString().slice(0, 10);
    }

    var session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    var role = session.role || 'SISWA';
    var isWali = (role === 'WALI_KELAS');
    var isBendahara = (role === 'BENDAHARA' || isWali);
    var isPengurus = (role === 'KETUA_KELAS' || role === 'SEKRETARIS' || isBendahara);

    var btnActions = document.getElementById('presensi-action-buttons');
    if (btnActions) {
      btnActions.style.display = isPengurus ? 'flex' : 'none';
    }

    await loadPresensiMassal();
  }

  async function loadPresensiMassal() {
    var tbody = document.getElementById('table-presensi-body');
    var tanggal = document.getElementById('presensi-date').value;
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data...</td></tr>';

    try {
      if (cacheDaftarSiswaPresensi.length === 0) {
        var resS = await postGAS({ action: 'getDataSiswa' });
        if (resS.status === 'success') {
          cacheDaftarSiswaPresensi = resS.data || [];
        }
      }

      if (cacheDaftarSiswaPresensi.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada data siswa terdaftar.</td></tr>';
        return;
      }

      var resP = await postGAS({ action: 'getPresensiByDate', tanggal: tanggal });
      var existMap = {};
      var ketMap = {};
      if (resP.status === 'success' && resP.data) {
        resP.data.forEach(function(p) {
          existMap[p.student_id] = p.status_kehadiran || 'H';
          ketMap[p.student_id] = p.keterangan || '';
        });
      }

      tbody.innerHTML = '';
      cacheDaftarSiswaPresensi.forEach(function(s, idx) {
        var sid = s.student_id;
        var cur = existMap[sid] || 'H';
        var ket = ketMap[sid] || '';

        var htmlRow = '' +
          '<tr data-student-id="' + sid + '">' +
            '<td class="text-center">' + (idx + 1) + '</td>' +
            '<td class="fw-semibold text-muted small">' + (s.nis || '-') + '</td>' +
            '<td class="fw-semibold text-dark">' + s.nama_lengkap + '</td>' +
            '<td class="text-center">' +
              '<div class="btn-group btn-group-sm w-100" role="group">' +
                '<input type="radio" class="btn-check" name="pres_' + sid + '" id="h_' + sid + '" value="H" ' + (cur === 'H' ? 'checked' : '') + ' onchange="updateSummaryAngka()">' +
                '<label class="btn btn-outline-success" for="h_' + sid + '">H</label>' +

                '<input type="radio" class="btn-check" name="pres_' + sid + '" id="s_' + sid + '" value="S" ' + (cur === 'S' ? 'checked' : '') + ' onchange="updateSummaryAngka()">' +
                '<label class="btn btn-outline-warning" for="s_' + sid + '">S</label>' +

                '<input type="radio" class="btn-check" name="pres_' + sid + '" id="i_' + sid + '" value="I" ' + (cur === 'I' ? 'checked' : '') + ' onchange="updateSummaryAngka()">' +
                '<label class="btn btn-outline-info" for="i_' + sid + '">I</label>' +

                '<input type="radio" class="btn-check" name="pres_' + sid + '" id="a_' + sid + '" value="A" ' + (cur === 'A' ? 'checked' : '') + ' onchange="updateSummaryAngka()">' +
                '<label class="btn btn-outline-danger" for="a_' + sid + '">A</label>' +
              '</div>' +
            '</td>' +
            '<td>' +
              '<input type="text" class="form-control form-control-sm pres-ket" value="' + ket + '" placeholder="Keterangan dispensasi / sakit / izin">' +
            '</td>' +
          '</tr>';

        tbody.innerHTML += htmlRow;
      });

      updateSummaryAngka();

    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center py-4">Gagal memuat presensi.</td></tr>';
    }
  }

  function setSemuaHadir() {
    var rows = document.querySelectorAll('#table-presensi-body tr');
    rows.forEach(function(r) {
      var sid = r.getAttribute('data-student-id');
      if (sid) {
        var rad = document.getElementById('h_' + sid);
        if (rad) {
          rad.checked = true;
        }
      }
    });
    updateSummaryAngka();
  }

  function updateSummaryAngka() {
    var h = 0, s = 0, i = 0, a = 0;
    var rows = document.querySelectorAll('#table-presensi-body tr');
    rows.forEach(function(r) {
      var sid = r.getAttribute('data-student-id');
      if (sid) {
        var checked = r.querySelector('input[name="pres_' + sid + '"]:checked');
        var val = checked ? checked.value : 'H';
        if (val === 'H') h++;
        else if (val === 'S') s++;
        else if (val === 'I') i++;
        else if (val === 'A') a++;
      }
    });
    document.getElementById('count-h').innerText = h;
    document.getElementById('count-s').innerText = s;
    document.getElementById('count-i').innerText = i;
    document.getElementById('count-a').innerText = a;
  }

  async function simpanPresensiMassal() {
    var tanggal = document.getElementById('presensi-date').value;
    var btn = document.getElementById('btn-save-presensi');
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    var records = [];
    var rows = document.querySelectorAll('#table-presensi-body tr');
    rows.forEach(function(r) {
      var sid = r.getAttribute('data-student-id');
      if (sid) {
        var checked = r.querySelector('input[name="pres_' + sid + '"]:checked');
        var ket = r.querySelector('.pres-ket').value.trim();
        records.push({
          student_id: sid,
          status_kehadiran: checked ? checked.value : 'H',
          keterangan: ket
        });
      }
    });

    var session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      var res = await postGAS({
        action: 'savePresensiBatch',
        tanggal: tanggal,
        records: records,
        user_id: session.user_id
      });
      alert(res.message);
    } catch (e) {
      alert('Gagal menyimpan presensi.');
    } finally {
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi';
      btn.disabled = false;
    }
  }

  function downloadTemplatePresensi() {
    if (typeof XLSX === 'undefined') {
      alert('Library SheetJS belum siap. Silakan muat ulang halaman.');
      return;
    }

    var tglSekarang = document.getElementById('presensi-date').value || new Date().toISOString().slice(0, 10);
    var templateData = [];

    if (cacheDaftarSiswaPresensi.length > 0) {
      templateData = cacheDaftarSiswaPresensi.map(function(s) {
        return {
          nis: s.nis || "",
          nama_lengkap: s.nama_lengkap || "",
          tanggal: tglSekarang,
          status_kehadiran: "H",
          keterangan: ""
        };
      });
    } else {
      templateData = [
        { nis: "3567", nama_lengkap: "Contoh Siswa", tanggal: tglSekarang, status_kehadiran: "H", keterangan: "Dispensasi Lomba" }
      ];
    }

    var worksheet = XLSX.utils.json_to_sheet(templateData);
    var workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "PRESENSI");
    XLSX.writeFile(workbook, "Template_Presensi_" + tglSekarang + ".xlsx");
  }

  function bukaModalImportPresensi() {
    document.getElementById('file-import-presensi').value = '';
    new bootstrap.Modal(document.getElementById('modalImportPresensi')).show();
  }

  function prosesImportExcelPresensi() {
    var fileInput = document.getElementById('file-import-presensi');
    if (!fileInput.files || fileInput.files.length === 0) {
      alert('Pilih berkas Excel presensi terlebih dahulu.');
      return;
    }

    var file = fileInput.files[0];
    var reader = new FileReader();
    var btn = document.getElementById('btn-proses-import-pres');

    btn.innerText = 'Membaca Berkas...';
    btn.disabled = true;

    reader.onload = async function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, { type: 'array' });
        var sheetName = workbook.SheetNames[0];
        var rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

        if (rows.length === 0) {
          alert('Berkas Excel kosong atau format tidak sesuai.');
          btn.innerText = 'Mulai Import Presensi';
          btn.disabled = false;
          return;
        }

        btn.innerText = 'Mengimpor ' + rows.length + ' Data...';
        var session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');

        var res = await postGAS({
          action: 'importPresensiBatch',
          user_id: session.user_id,
          rows: rows
        });

        alert(res.message);
        if (res.status === 'success') {
          bootstrap.Modal.getInstance(document.getElementById('modalImportPresensi')).hide();
          loadPresensiMassal();
        }
      } catch (err) {
        alert('Gagal membaca Excel presensi: ' + err.toString());
      } finally {
        btn.innerText = 'Mulai Import Presensi';
        btn.disabled = false;
      }
    };

    reader.readAsArrayBuffer(file);
  }

  initPresensi();
</script>
