<section id="panel-presensi">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="small fw-semibold text-secondary">Tanggal:</label>
        <input type="date" id="presensi-date" class="form-control form-control-sm" style="width: 150px;">
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-semua-hadir">
          <i class="fa-solid fa-check-double me-1 text-success"></i> Set Semua Hadir
        </button>
      </div>
      <div class="d-flex gap-2" id="presensi-action-buttons">
        <button type="button" class="btn btn-outline-success btn-sm" id="btn-dl-template-pres">
          <i class="fa-solid fa-download me-1"></i> Template Excel
        </button>
        <button type="button" class="btn btn-outline-primary btn-sm" id="btn-modal-import-pres">
          <i class="fa-solid fa-file-import me-1"></i> Import Excel
        </button>
        <button type="button" class="btn btn-success btn-sm px-3" id="btn-save-presensi">
          <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi
        </button>
      </div>
    </div>

    <!-- Rekap Angka Singkat -->
    <div class="row g-2 mb-3 text-center small">
      <div class="col-3"><div class="p-2 border rounded bg-success-subtle text-success fw-bold">Hadir: <span id="count-h">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-warning-subtle text-warning-emphasis fw-bold">Sakit: <span id="count-s">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-info-subtle text-info fw-bold">Izin: <span id="count-i">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-danger-subtle text-danger fw-bold">Alfa: <span id="count-a">0</span></div></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45px;" class="text-center">No</th>
            <th>NIS</th>
            <th>Nama Siswa</th>
            <th style="width: 250px;" class="text-center">Status Kehadiran</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="table-presensi-body">
          <tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal Import Presensi -->
<div class="modal fade" id="modalImportPresensi" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title fw-bold">Import Presensi via Excel</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <p class="small text-muted mb-2">Pastikan kolom Excel memuat: nis, tanggal, status_kehadiran, keterangan.</p>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Pilih Berkas Excel (.xlsx / .xls)</label>
          <input type="file" id="file-import-presensi" class="form-control form-control-sm" accept=".xlsx, .xls">
        </div>
        <button type="button" id="btn-proses-import-pres" class="btn btn-success btn-sm w-100">Mulai Import Presensi</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var cacheSiswa = [];

  function getSession() {
    return JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
  }

  function initElements() {
    var dateInput = document.getElementById('presensi-date');
    if (dateInput && !dateInput.value) {
      dateInput.value = new Date().toISOString().slice(0, 10);
    }

    var session = getSession();
    var role = session.role || 'SISWA';
    var isWali = (role === 'WALI_KELAS');
    var isBendahara = (role === 'BENDAHARA' || isWali);
    var isPengurus = (role === 'KETUA_KELAS' || role === 'SEKRETARIS' || isBendahara);

    var actBox = document.getElementById('presensi-action-buttons');
    if (actBox) {
      actBox.style.display = isPengurus ? 'flex' : 'none';
    }

    // Event Listener
    if (dateInput) {
      dateInput.onchange = loadPresensi;
    }
    var btnSemua = document.getElementById('btn-semua-hadir');
    if (btnSemua) {
      btnSemua.onclick = setSemuaHadir;
    }
    var btnSave = document.getElementById('btn-save-presensi');
    if (btnSave) {
      btnSave.onclick = simpanPresensi;
    }
    var btnDl = document.getElementById('btn-dl-template-pres');
    if (btnDl) {
      btnDl.onclick = unduhTemplate;
    }
    var btnModalImp = document.getElementById('btn-modal-import-pres');
    if (btnModalImp) {
      btnModalImp.onclick = function() {
        document.getElementById('file-import-presensi').value = '';
        new bootstrap.Modal(document.getElementById('modalImportPresensi')).show();
      };
    }
    var btnProcImp = document.getElementById('btn-proses-import-pres');
    if (btnProcImp) {
      btnProcImp.onclick = prosesImport;
    }

    loadPresensi();
  }

  async function loadPresensi() {
    var tbody = document.getElementById('table-presensi-body');
    var tglInput = document.getElementById('presensi-date');
    if (!tbody || !tglInput) return;

    var tanggal = tglInput.value;
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data...</td></tr>';

    try {
      if (cacheSiswa.length === 0) {
        var resS = await postGAS({ action: 'getDataSiswa' });
        if (resS.status === 'success') {
          cacheSiswa = resS.data || [];
        }
      }

      if (cacheSiswa.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada siswa terdaftar.</td></tr>';
        return;
      }

      var resP = await postGAS({ action: 'getPresensiByDate', tanggal: tanggal });
      var mapStatus = {};
      var mapKet = {};
      if (resP.status === 'success' && resP.data) {
        for (var i = 0; i < resP.data.length; i++) {
          var item = resP.data[i];
          mapStatus[item.student_id] = item.status_kehadiran || 'H';
          mapKet[item.student_id] = item.keterangan || '';
        }
      }

      tbody.innerHTML = '';
      for (var j = 0; j < cacheSiswa.length; j++) {
        var s = cacheSiswa[j];
        var sid = s.student_id;
        var st = mapStatus[sid] || 'H';
        var kt = mapKet[sid] || '';

        var tr = document.createElement('tr');
        tr.setAttribute('data-sid', sid);

        var tdNo = document.createElement('td');
        tdNo.className = 'text-center';
        tdNo.textContent = j + 1;

        var tdNis = document.createElement('td');
        tdNis.className = 'fw-semibold text-muted small';
        tdNis.textContent = s.nis || '-';

        var tdNama = document.createElement('td');
        tdNama.className = 'fw-semibold text-dark';
        tdNama.textContent = s.nama_lengkap;

        var tdRadio = document.createElement('td');
        tdRadio.className = 'text-center';
        tdRadio.innerHTML = '<div class="btn-group btn-group-sm w-100">' +
          '<input type="radio" class="btn-check" name="pr_' + sid + '" id="h_' + sid + '" value="H" ' + (st === 'H' ? 'checked' : '') + '>' +
          '<label class="btn btn-outline-success" for="h_' + sid + '">H</label>' +
          '<input type="radio" class="btn-check" name="pr_' + sid + '" id="s_' + sid + '" value="S" ' + (st === 'S' ? 'checked' : '') + '>' +
          '<label class="btn btn-outline-warning" for="s_' + sid + '">S</label>' +
          '<input type="radio" class="btn-check" name="pr_' + sid + '" id="i_' + sid + '" value="I" ' + (st === 'I' ? 'checked' : '') + '>' +
          '<label class="btn btn-outline-info" for="i_' + sid + '">I</label>' +
          '<input type="radio" class="btn-check" name="pr_' + sid + '" id="a_' + sid + '" value="A" ' + (st === 'A' ? 'checked' : '') + '>' +
          '<label class="btn btn-outline-danger" for="a_' + sid + '">A</label>' +
          '</div>';

        var tdKet = document.createElement('td');
        tdKet.innerHTML = '<input type="text" class="form-control form-control-sm inp-ket" value="' + kt + '" placeholder="Keterangan dispensasi / sakit / izin">';

        tr.appendChild(tdNo);
        tr.appendChild(tdNis);
        tr.appendChild(tdNama);
        tr.appendChild(tdRadio);
        tr.appendChild(tdKet);
        tbody.appendChild(tr);

        // Bind listener radio
        var radios = tr.querySelectorAll('input[type="radio"]');
        for (var r = 0; r < radios.length; r++) {
          radios[r].onchange = hitungRekap;
        }
      }

      hitungRekap();

    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center py-4">Gagal memuat presensi.</td></tr>';
    }
  }

  function setSemuaHadir() {
    var rows = document.querySelectorAll('#table-presensi-body tr');
    for (var i = 0; i < rows.length; i++) {
      var sid = rows[i].getAttribute('data-sid');
      if (sid) {
        var radH = document.getElementById('h_' + sid);
        if (radH) radH.checked = true;
      }
    }
    hitungRekap();
  }

  function hitungRekap() {
    var h = 0, s = 0, i = 0, a = 0;
    var rows = document.querySelectorAll('#table-presensi-body tr');
    for (var j = 0; j < rows.length; j++) {
      var sid = rows[j].getAttribute('data-sid');
      if (sid) {
        var chk = rows[j].querySelector('input[name="pr_' + sid + '"]:checked');
        var val = chk ? chk.value : 'H';
        if (val === 'H') h++;
        else if (val === 'S') s++;
        else if (val === 'I') i++;
        else if (val === 'A') a++;
      }
    }
    document.getElementById('count-h').textContent = h;
    document.getElementById('count-s').textContent = s;
    document.getElementById('count-i').textContent = i;
    document.getElementById('count-a').textContent = a;
  }

  async function simpanPresensi() {
    var tglInput = document.getElementById('presensi-date');
    var btn = document.getElementById('btn-save-presensi');
    if (!tglInput || !btn) return;

    var tanggal = tglInput.value;
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    var records = [];
    var rows = document.querySelectorAll('#table-presensi-body tr');
    for (var k = 0; k < rows.length; k++) {
      var sid = rows[k].getAttribute('data-sid');
      if (sid) {
        var chk = rows[k].querySelector('input[name="pr_' + sid + '"]:checked');
        var inp = rows[k].querySelector('.inp-ket');
        records.push({
          student_id: sid,
          status_kehadiran: chk ? chk.value : 'H',
          keterangan: inp ? inp.value.trim() : ''
        });
      }
    }

    var session = getSession();
    try {
      var res = await postGAS({
        action: 'savePresensiBatch',
        tanggal: tanggal,
        records: records,
        user_id: session.user_id
      });
      alert(res.message);
    } catch (e) {
      alert('Gagal menyimpan presensi.');
    } finally {
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi';
      btn.disabled = false;
    }
  }

  function unduhTemplate() {
    if (typeof XLSX === 'undefined') {
      alert('Library SheetJS belum siap.');
      return;
    }
    var tgl = document.getElementById('presensi-date').value || new Date().toISOString().slice(0, 10);
    var dataRows = [];

    if (cacheSiswa.length > 0) {
      for (var l = 0; l < cacheSiswa.length; l++) {
        dataRows.push({
          nis: cacheSiswa[l].nis || '',
          nama_lengkap: cacheSiswa[l].nama_lengkap || '',
          tanggal: tgl,
          status_kehadiran: 'H',
          keterangan: ''
        });
      }
    } else {
      dataRows.push({ nis: '3567', nama_lengkap: 'Contoh Siswa', tanggal: tgl, status_kehadiran: 'H', keterangan: '' });
    }

    var ws = XLSX.utils.json_to_sheet(dataRows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'PRESENSI');
    XLSX.writeFile(wb, 'Template_Presensi_' + tgl + '.xlsx');
  }

  function prosesImport() {
    var fileInp = document.getElementById('file-import-presensi');
    if (!fileInp || !fileInp.files || fileInp.files.length === 0) {
      alert('Pilih berkas Excel terlebih dahulu.');
      return;
    }
    var file = fileInp.files[0];
    var reader = new FileReader();
    var btn = document.getElementById('btn-proses-import-pres');

    btn.innerText = 'Membaca Berkas...';
    btn.disabled = true;

    reader.onload = async function(ev) {
      try {
        var arr = new Uint8Array(ev.target.result);
        var wb = XLSX.read(arr, { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws);

        if (!rows || rows.length === 0) {
          alert('Berkas kosong.');
          btn.innerText = 'Mulai Import Presensi';
          btn.disabled = false;
          return;
        }

        btn.innerText = 'Mengimpor ' + rows.length + ' Data...';
        var session = getSession();
        var res = await postGAS({
          action: 'importPresensiBatch',
          user_id: session.user_id,
          rows: rows
        });

        alert(res.message);
        if (res.status === 'success') {
          bootstrap.Modal.getInstance(document.getElementById('modalImportPresensi')).hide();
          loadPresensi();
        }
      } catch (err) {
        alert('Gagal membaca Excel: ' + err.toString());
      } finally {
        btn.innerText = 'Mulai Import Presensi';
        btn.disabled = false;
      }
    };

    reader.readAsArrayBuffer(file);
  }

  initElements();
})();
</script>
