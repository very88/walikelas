<section id="panel-presensi">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="small fw-semibold text-secondary">Tanggal:</label>
        <input type="date" id="presensi-date" class="form-control form-control-sm" style="width: 150px;" onchange="loadPresensiMassal()">
        <button class="btn btn-outline-secondary btn-sm" onclick="setSemuaHadir()">
          <i class="fa-solid fa-check-double me-1 text-success"></i> Set Semua Hadir
        </button>
      </div>
      <div class="d-flex gap-2" id="presensi-action-buttons">
        <button class="btn btn-outline-success btn-sm" onclick="downloadTemplatePresensi()">
          <i class="fa-solid fa-download me-1"></i> Template Excel
        </button>
        <button class="btn btn-outline-primary btn-sm" onclick="bukaModalImportPresensi()">
          <i class="fa-solid fa-file-import me-1"></i> Import Excel
        </button>
        <button id="btn-save-presensi" class="btn btn-success btn-sm px-3" onclick="simpanPresensiMassal()">
          <i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi
        </button>
      </div>
    </div>

    <!-- Ringkasan Angka Cepat Hari Ini -->
    <div class="row g-2 mb-3 text-center small">
      <div class="col-3"><div class="p-2 border rounded bg-success-subtle text-success fw-bold">Hadir: <span id="count-h">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-warning-subtle text-warning-emphasis fw-bold">Sakit: <span id="count-s">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-info-subtle text-info fw-bold">Izin: <span id="count-i">0</span></div></div>
      <div class="col-3"><div class="p-2 border rounded bg-danger-subtle text-danger fw-bold">Alfa: <span id="count-a">0</span></div></div>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45px;" class="text-center">No</th>
            <th>NIS</th>
            <th>Nama Siswa</th>
            <th style="width: 260px;" class="text-center">Status Kehadiran</th>
            <th>Keterangan Tambahan</th>
          </tr>
        </thead>
        <tbody id="table-presensi-body">
          <tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data siswa...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal Import Presensi Excel -->
<div class="modal fade" id="modalImportPresensi" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h6 class="modal-title fw-bold"><i class="fa-solid fa-file-import me-2"></i>Import Presensi via Excel</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <p class="small text-muted mb-2">
          Format kolom wajib: <code>nis</code>, <code>tanggal</code> (YYYY-MM-DD), <code>status_kehadiran</code> (H / S / I / A), dan <code>keterangan</code>.
        </p>
        <div class="mb-3">
          <label class="form-label small fw-semibold">Pilih Berkas Excel (.xlsx / .xls)</label>
          <input type="file" id="file-import-presensi" class="form-control form-control-sm" accept=".xlsx, .xls">
        </div>
        <button type="button" id="btn-proses-import-pres" class="btn btn-success btn-sm w-100" onclick="prosesImportExcelPresensi()">
          Mulai Import Presensi
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let cacheDaftarSiswaPresensi = [];

  async function initPresensi() {
    const inputTgl = document.getElementById('presensi-date');
    if (!inputTgl.value) {
      inputTgl.value = new Date().toISOString().slice(0, 10);
    }

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    const role = session.role || 'SISWA';
    const isWali = (role === 'WALI_KELAS');
    const isBendahara = (role === 'BENDAHARA' || isWali);
    const isPengurus = (role === 'KETUA_KELAS' || role === 'SEKRETARIS' || isBendahara);

    const btnActions = document.getElementById('presensi-action-buttons');
    if (btnActions) btnActions.style.display = isPengurus ? 'flex' : 'none';

    await loadPresensiMassal();
  }

  async function loadPresensiMassal() {
    const tbody = document.getElementById('table-presensi-body');
    const tanggal = document.getElementById('presensi-date').value;
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data...</td></tr>';

    try {
      if (cacheDaftarSiswaPresensi.length === 0) {
        const resS = await postGAS({ action: 'getDataSiswa' });
        if (resS.status === 'success') {
          cacheDaftarSiswaPresensi = resS.data || [];
        }
      }

      if (cacheDaftarSiswaPresensi.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada siswa terdaftar. Silakan input siswa terlebih dahulu.</td></tr>';
        return;
      }

      const resP = await postGAS({ action: 'getPresensiByDate', tanggal: tanggal });
      const existMap = {};
      const ketMap = {};
      if (resP.status === 'success' && resP.data) {
        resP.data.forEach(p => {
          existMap[p.student_id] = p.status_kehadiran || 'H';
          ketMap[p.student_id] = p.keterangan || '';
        });
      }

      tbody.innerHTML = '';
      cacheDaftarSiswaPresensi.forEach((s, idx) => {
        const sid = s.student_id;
        const cur = existMap[sid] || 'H';
        const ket = ketMap[sid] || '';

        tbody.innerHTML += `
          <tr data-student-id="${sid}">
            <td class="text-center">${idx + 1}</td>
            <td class="fw-semibold text-muted small">${s.nis || '-'}</td>
            <td class="fw-semibold text-dark">${s.nama_lengkap}</td>
            <td class="text-center">
              <div class="btn-group btn-group-sm w-100" role="group">
                <input type="radio" class="btn-check" name="pres_${sid}" id="h_${sid}" value="H" ${cur === 'H' ? 'checked' : ''} onchange="updateSummaryAngka()">
                <label class="btn btn-outline-success" for="h_${sid}">H</label>

                <input type="radio" class="btn-check" name="pres_${sid}" id="s_${sid}" value="S" ${cur === 'S' ? 'checked' : ''} onchange="updateSummaryAngka()">
                <label class="btn btn-outline-warning" for="s_${sid}">S</label>

                <input type="radio" class="btn-check" name="pres_${sid}" id="i_${sid}" value="I" ${cur === 'I' ? 'checked' : ''} onchange="updateSummaryAngka()">
                <label class="btn btn-outline-info" for="i_${sid}">I</label>

                <input type="radio" class="btn-check" name="pres_${sid}" id="a_${sid}" value="A" ${cur === 'A' ? 'checked' : ''} onchange="updateSummaryAngka()">
                <label class="btn btn-outline-danger" for="a_${sid}">A</label>
              </div>
            </td>
            <td>
              <input type="text" class="form-control form-control-sm pres-ket" value="${ket}" placeholder="Keterangan dispensasi / surat sakit / lainnya">
            </td>
          </tr>
        `;
      });

      updateSummaryAngka();

    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center py-4">Gagal memuat presensi.</td></tr>';
    }
  }

  function setSemuaHadir() {
    document.querySelectorAll('#table-presensi-body tr').forEach(r => {
      const sid = r.getAttribute('data-student-id');
      if (sid) {
        const rad = document.getElementById(`h_${sid}`);
        if (rad) rad.checked = true;
      }
    });
    updateSummaryAngka();
  }

  function updateSummaryAngka() {
    let h = 0, s = 0, i = 0, a = 0;
    document.querySelectorAll('#table-presensi-body tr').forEach(r => {
      const sid = r.getAttribute('data-student-id');
      if (sid) {
        const checked = r.querySelector(`input[name="pres_${sid}"]:checked`);
        const val = checked ? checked.value : 'H';
        if (val === 'H') h++;
        else if (val === 'S') s++;
        else if (val === 'I') i++;
        else if (val === 'A') a++;
      }
    });
    document.getElementById('count-h').innerText = h;
    document.getElementById('count-s').innerText = s;
    document.getElementById('count-i').innerText = i;
    document.getElementById('count-a').innerText = a;
  }

  async function simpanPresensiMassal() {
    const tanggal = document.getElementById('presensi-date').value;
    const btn = document.getElementById('btn-save-presensi');
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    const records = [];
    document.querySelectorAll('#table-presensi-body tr').forEach(r => {
      const sid = r.getAttribute('data-student-id');
      if (sid) {
        const checked = r.querySelector(`input[name="pres_${sid}"]:checked`);
        const ket = r.querySelector('.pres-ket').value.trim();
        records.push({
          student_id: sid,
          status_kehadiran: checked ? checked.value : 'H',
          keterangan: ket
        });
      }
    });

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({
        action: 'savePresensiBatch',
        tanggal: tanggal,
        records: records,
        user_id: session.user_id
      });
      alert(res.message);
    } catch (e) {
      alert('Gagal menyimpan presensi.');
    } finally {
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Simpan Presensi';
      btn.disabled = false;
    }
  }

  // DOWNLOAD TEMPLATE EXCEL PRESENSI
  function downloadTemplatePresensi() {
    if (typeof XLSX === 'undefined') {
      alert('Library SheetJS belum siap.');
      return;
    }

    const tglSekarang = document.getElementById('presensi-date').value || new Date().toISOString().slice(0, 10);
    const templateData = cacheDaftarSiswaPresensi.length > 0 
      ? cacheDaftarSiswaPresensi.map(s => ({
          nis: s.nis || "",
          nama_lengkap: s.nama_lengkap || "",
          tanggal: tglSekarang,
          status_kehadiran: "H",
          keterangan: ""
        }))
      : [
          { nis: "3567", nama_lengkap: "Contoh Siswa", tanggal: tglSekarang, status_kehadiran: "H", keterangan: "Dispensasi Lomba" }
        ];

    const worksheet = XLSX.utils.json_to_sheet(templateData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "PRESENSI");
    XLSX.writeFile(workbook, `Template_Presensi_${tglSekarang}.xlsx`);
  }

  // IMPORT EXCEL PRESENSI
  function bukaModalImportPresensi() {
    document.getElementById('file-import-presensi').value = '';
    new bootstrap.Modal(document.getElementById('modalImportPresensi')).show();
  }

  function prosesImportExcelPresensi() {
    const fileInput = document.getElementById('file-import-presensi');
    if (!fileInput.files || fileInput.files.length === 0) {
      alert('Pilih berkas Excel presensi terlebih dahulu.');
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();
    const btn = document.getElementById('btn-proses-import-pres');

    btn.innerText = 'Membaca Berkas...';
    btn.disabled = true;

    reader.onload = async function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

        if (rows.length === 0) {
          alert('Berkas Excel kosong.');
          btn.innerText = 'Mulai Import Presensi';
          btn.disabled = false;
          return;
        }

        btn.innerText = `Mengimpor ${rows.length} Data...`;
        const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');

        const res = await postGAS({
          action: 'importPresensiBatch',
          user_id: session.user_id,
          rows: rows
        });

        alert(res.message);
        if (res.status === 'success') {
          bootstrap.Modal.getInstance(document.getElementById('modalImportPresensi')).hide();
          loadPresensiMassal();
        }
      } catch (err) {
        alert('Gagal membaca Excel presensi: ' + err.toString());
      } finally {
        btn.innerText = 'Mulai Import Presensi';
        btn.disabled = false;
      }
    };

    reader.readAsArrayBuffer(file);
  }

  initPresensi();
</script>
