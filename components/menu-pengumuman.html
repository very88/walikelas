<section id="panel-pengumuman">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-bullhorn me-1 text-primary"></i> Papan Pengumuman Kelas</h6>
        <small class="text-muted">Informasi dan instruksi resmi dari Wali Kelas & Pengurus Kelas</small>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-tambah-ann" style="display: none;" onclick="bukaModalPengumuman()">
        <i class="fa-solid fa-plus me-1"></i> Buat Pengumuman
      </button>
    </div>

    <div id="pengumuman-list-container">
      <div class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat pengumuman...</div>
    </div>
  </div>
</section>

<!-- Modal Buat Pengumuman -->
<div class="modal fade" id="modalPengumuman" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h6 class="modal-title fw-bold"><i class="fa-solid fa-bullhorn me-2"></i>Buat Pengumuman Kelas</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <form id="form-pengumuman" onsubmit="submitFormPengumuman(event)">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Judul Pengumuman</label>
            <input type="text" id="ann-judul" class="form-control form-control-sm" required placeholder="Contoh: Iuran Kas / Jadwal Piket Baru">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Isi Pengumuman</label>
            <textarea id="ann-isi" class="form-control form-control-sm" rows="4" required placeholder="Tuliskan isi pengumuman secara rinci..."></textarea>
          </div>
          <button type="submit" id="btn-save-ann" class="btn btn-primary btn-sm w-100">Publikasikan Pengumuman</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  async function loadPengumuman() {
    const box = document.getElementById('pengumuman-list-container');
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    const role = session.role || 'SISWA';
    const isWali = (role === 'WALI_KELAS');
    const isBendahara = (role === 'BENDAHARA' || isWali);
    const isPengurus = (role === 'KETUA_KELAS' || role === 'SEKRETARIS' || isBendahara);

    // Tampilkan tombol Buat Pengumuman jika perannya adalah Pengurus atau Wali Kelas
    const btnTambah = document.getElementById('btn-tambah-ann');
    if (btnTambah) {
      btnTambah.style.display = isPengurus ? 'block' : 'none';
    }

    try {
      const res = await postGAS({ action: 'getDataPengumuman' });
      if (res.status === 'success') {
        box.innerHTML = '';
        if (!res.data || res.data.length === 0) {
          box.innerHTML = '<div class="text-center py-4 text-muted small"><i class="fa-regular fa-bell-slash me-1"></i>Belum ada pengumuman kelas yang dipublikasikan.</div>';
          return;
        }

        res.data.forEach(p => {
          box.innerHTML += `
            <div class="p-3 border rounded mb-3 bg-light position-relative">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <h6 class="fw-bold text-primary mb-0">${p.judul}</h6>
                <small class="text-muted" style="font-size: 0.75rem;">${p.tanggal_posting || ''}</small>
              </div>
              <p class="small text-secondary mb-2" style="white-space: pre-line;">${p.isi}</p>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <small class="text-muted" style="font-size: 0.75rem;"><i class="fa-solid fa-user-pen me-1"></i>Oleh: <strong>${p.author || 'Pengurus Kelas'}</strong></small>
                ${isPengurus ? `
                  <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="hapusPengumuman('${p.pengumuman_id}')" title="Hapus Pengumuman">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                ` : ''}
              </div>
            </div>
          `;
        });
      } else {
        box.innerHTML = `<div class="alert alert-danger py-2 small">${res.message}</div>`;
      }
    } catch (e) {
      box.innerHTML = '<div class="text-danger text-center small py-3">Gagal memuat pengumuman.</div>';
    }
  }

  function bukaModalPengumuman() {
    document.getElementById('form-pengumuman').reset();
    new bootstrap.Modal(document.getElementById('modalPengumuman')).show();
  }

  async function submitFormPengumuman(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save-ann');
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    const role = session.role || 'SISWA';

    // Label pembuat pengumuman sesuai peran
    let authorLabel = 'Wali Kelas';
    if (role === 'KETUA_KELAS') authorLabel = 'Ketua Kelas';
    else if (role === 'SEKRETARIS') authorLabel = 'Sekretaris Kelas';
    else if (role === 'BENDAHARA') authorLabel = 'Bendahara Kelas';

    try {
      const res = await postGAS({
        action: 'savePengumuman',
        user_id: session.user_id,
        payload: {
          judul: document.getElementById('ann-judul').value.trim(),
          isi: document.getElementById('ann-isi').value.trim(),
          author: authorLabel
        }
      });

      alert(res.message);
      if (res.status === 'success') {
        bootstrap.Modal.getInstance(document.getElementById('modalPengumuman')).hide();
        loadPengumuman();
      }
    } catch (err) {
      alert('Gagal mempublikasikan pengumuman.');
    } finally {
      btn.innerText = 'Publikasikan Pengumuman';
      btn.disabled = false;
    }
  }

  async function hapusPengumuman(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus pengumuman ini?')) return;
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({ action: 'deletePengumuman', pengumuman_id: id, user_id: session.user_id });
      alert(res.message);
      loadPengumuman();
    } catch (e) {
      alert('Gagal menghapus pengumuman.');
    }
  }

  loadPengumuman();
</script>
