<section id="panel-pengumuman">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-bullhorn me-1 text-primary"></i> Papan Pengumuman Kelas</h6>
        <small class="text-muted">Informasi dan instruksi resmi untuk siswa</small>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-tambah-ann" onclick="bukaModalPengumuman()">
        <i class="fa-solid fa-plus me-1"></i> Buat Pengumuman
      </button>
    </div>

    <div id="pengumuman-list-container">
      <div class="text-center py-4 text-muted">Memuat pengumuman...</div>
    </div>
  </div>
</section>

<!-- Modal Buat Pengumuman -->
<div class="modal fade" id="modalPengumuman" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h6 class="modal-title fw-bold">Buat Pengumuman</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <form id="form-pengumuman" onsubmit="submitFormPengumuman(event)">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Judul Pengumuman</label>
            <input type="text" id="ann-judul" class="form-control form-control-sm" required placeholder="Contoh: Jadwal Ujian PTS">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Isi Pengumuman</label>
            <textarea id="ann-isi" class="form-control form-control-sm" rows="4" required placeholder="Tuliskan detail pengumuman..."></textarea>
          </div>
          <button type="submit" id="btn-save-ann" class="btn btn-primary btn-sm w-100">Publikasikan</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  async function loadPengumuman() {
    const box = document.getElementById('pengumuman-list-container');
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    const isWali = (session.role === 'WALI_KELAS');
    if (!isWali) document.getElementById('btn-tambah-ann').style.display = 'none';

    try {
      const res = await postGAS({ action: 'getDataPengumuman' });
      if (res.status === 'success') {
        box.innerHTML = '';
        if (res.data.length === 0) {
          box.innerHTML = '<div class="text-center py-4 text-muted">Belum ada pengumuman kelas.</div>';
          return;
        }
        res.data.forEach(p => {
          box.innerHTML += `
            <div class="p-3 border rounded mb-3 bg-light position-relative">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <h6 class="fw-bold text-primary mb-0">${p.judul}</h6>
                <small class="text-muted">${p.tanggal_posting || ''}</small>
              </div>
              <p class="small text-secondary mb-1">${p.isi}</p>
              <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted"><i class="fa-solid fa-user-pen me-1"></i>${p.author || 'Wali Kelas'}</small>
                ${isWali ? `<button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="hapusPengumuman('${p.pengumuman_id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
              </div>
            </div>
          `;
        });
      }
    } catch (e) {
      box.innerHTML = '<div class="text-danger text-center">Gagal memuat pengumuman.</div>';
    }
  }

  function bukaModalPengumuman() {
    document.getElementById('form-pengumuman').reset();
    new bootstrap.Modal(document.getElementById('modalPengumuman')).show();
  }

  async function submitFormPengumuman(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save-ann');
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({
        action: 'savePengumuman',
        user_id: session.user_id,
        payload: {
          judul: document.getElementById('ann-judul').value.trim(),
          isi: document.getElementById('ann-isi').value.trim(),
          author: 'Wali Kelas'
        }
      });
      alert(res.message);
      if (res.status === 'success') {
        bootstrap.Modal.getInstance(document.getElementById('modalPengumuman')).hide();
        loadPengumuman();
      }
    } catch (err) {
      alert('Gagal mempublikasikan pengumuman.');
    } finally {
      btn.innerText = 'Publikasikan';
      btn.disabled = false;
    }
  }

  async function hapusPengumuman(id) {
    if (!confirm('Hapus pengumuman ini?')) return;
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({ action: 'deletePengumuman', pengumuman_id: id, user_id: session.user_id });
      alert(res.message);
      loadPengumuman();
    } catch (e) {
      alert('Gagal menghapus.');
    }
  }

  loadPengumuman();
</script>
