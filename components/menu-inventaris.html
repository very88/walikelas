<section id="panel-inventaris">
  <div class="card card-kpi">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h6 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-boxes-stacked me-1 text-primary"></i> Inventaris & Sarana Ruang Kelas</h6>
        <small class="text-muted">Pencatatan aset dan kondisi perlengkapan kelas oleh Wali Kelas & Pengurus Kelas</small>
      </div>
      <button class="btn btn-primary btn-sm" id="btn-tambah-inv" style="display: none;" onclick="bukaModalInventaris()">
        <i class="fa-solid fa-plus me-1"></i> Tambah Barang
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th style="width: 45px;">No</th>
            <th>Nama Barang</th>
            <th class="text-center">Jumlah</th>
            <th class="text-center">Kondisi</th>
            <th>Lokasi</th>
            <th>Pengecekan Terakhir</th>
            <th class="text-center" style="width: 80px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="table-inventaris-body">
          <tr><td colspan="7" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Memuat data inventaris...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal Input Inventaris -->
<div class="modal fade" id="modalInventaris" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h6 class="modal-title fw-bold"><i class="fa-solid fa-boxes-stacked me-2"></i>Tambah Inventaris Kelas</h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <form id="form-inventaris" onsubmit="submitFormInventaris(event)">
          <div class="mb-2">
            <label class="form-label small fw-semibold">Nama Barang</label>
            <input type="text" id="inv-nama" class="form-control form-control-sm" required placeholder="Contoh: Papan Tulis Whiteboard / Spidol">
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small fw-semibold">Jumlah</label>
              <input type="number" id="inv-jumlah" class="form-control form-control-sm" min="1" value="1" required>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold">Kondisi</label>
              <select id="inv-kondisi" class="form-select form-select-sm">
                <option value="Baik">Baik</option>
                <option value="Rusak Ringan">Rusak Ringan</option>
                <option value="Rusak Berat">Rusak Berat</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Lokasi Penyimpanan</label>
            <input type="text" id="inv-lokasi" class="form-control form-control-sm" value="Ruang Kelas" required>
          </div>
          <button type="submit" id="btn-save-inv" class="btn btn-primary btn-sm w-100">Simpan Barang Inventaris</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  async function loadDataInventaris() {
    const tbody = document.getElementById('table-inventaris-body');
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    const role = session.role || 'SISWA';
    const isWali = (role === 'WALI_KELAS');
    const isBendahara = (role === 'BENDAHARA' || isWali);
    const isPengurus = (role === 'KETUA_KELAS' || role === 'SEKRETARIS' || isBendahara);

    // Tampilkan tombol Tambah Barang hanya untuk Pengurus dan Wali Kelas
    const btnTambah = document.getElementById('btn-tambah-inv');
    if (btnTambah) {
      btnTambah.style.display = isPengurus ? 'block' : 'none';
    }

    try {
      const res = await postGAS({ action: 'getDataInventaris' });
      if (res.status === 'success') {
        tbody.innerHTML = '';
        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Belum ada barang inventaris yang dicatat.</td></tr>';
          return;
        }

        res.data.forEach((inv, idx) => {
          let badge = 'bg-success';
          if (inv.kondisi === 'Rusak Ringan') badge = 'bg-warning text-dark';
          else if (inv.kondisi === 'Rusak Berat') badge = 'bg-danger';

          tbody.innerHTML += `
            <tr>
              <td>${idx + 1}</td>
              <td class="fw-semibold text-dark">${inv.nama_barang || '-'}</td>
              <td class="text-center fw-bold">${inv.jumlah || 1}</td>
              <td class="text-center"><span class="badge ${badge}">${inv.kondisi || 'Baik'}</span></td>
              <td>${inv.lokasi || 'Kelas'}</td>
              <td><small class="text-muted">${(inv.tanggal_cek || '').toString().slice(0, 10)}</small></td>
              <td class="text-center">
                ${isPengurus ? `
                  <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="hapusInventaris('${inv.inventaris_id}')" title="Hapus Barang">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                ` : '<span class="text-muted small">-</span>'}
              </td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = `<tr><td colspan="7" class="text-danger text-center py-4">${res.message}</td></tr>`;
      }
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-danger text-center py-4">Gagal memuat inventaris.</td></tr>';
    }
  }

  function bukaModalInventaris() {
    document.getElementById('form-inventaris').reset();
    new bootstrap.Modal(document.getElementById('modalInventaris')).show();
  }

  async function submitFormInventaris(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-save-inv');
    btn.innerText = 'Menyimpan...';
    btn.disabled = true;

    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({
        action: 'saveInventaris',
        user_id: session.user_id,
        payload: {
          nama_barang: document.getElementById('inv-nama').value.trim(),
          jumlah: document.getElementById('inv-jumlah').value,
          kondisi: document.getElementById('inv-kondisi').value,
          lokasi: document.getElementById('inv-lokasi').value.trim()
        }
      });

      alert(res.message);
      if (res.status === 'success') {
        bootstrap.Modal.getInstance(document.getElementById('modalInventaris')).hide();
        loadDataInventaris();
      }
    } catch (err) {
      alert('Gagal menyimpan inventaris.');
    } finally {
      btn.innerText = 'Simpan Barang Inventaris';
      btn.disabled = false;
    }
  }

  async function hapusInventaris(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus data barang inventaris ini?')) return;
    const session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    try {
      const res = await postGAS({ action: 'deleteInventaris', inventaris_id: id, user_id: session.user_id });
      alert(res.message);
      loadDataInventaris();
    } catch (e) {
      alert('Gagal menghapus inventaris.');
    }
  }

  loadDataInventaris();
</script>
