<section id="panel-dashboard">
  <!-- Container Header Dinamis Dashboard -->
  <div id="dashboard-header-container" class="mb-4">
    <div class="card p-3 border-0 bg-white rounded-3 shadow-sm">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
          <h5 class="fw-bold mb-1 text-dark" id="dash-title">Ringkasan Dashboard</h5>
          <small class="text-muted" id="dash-desc">Memuat data analisis...</small>
        </div>
        <div id="dash-badge-slot"></div>
      </div>
    </div>
  </div>

  <!-- Container Kartu KPI Adaptif -->
  <div class="row g-3" id="dashboard-kpi-container">
    <div class="col-12 text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>Menyesuaikan statistik dengan peran Anda...
    </div>
  </div>

  <!-- Container Detail Tambahan -->
  <div class="row g-3 mt-1" id="dashboard-extra-container"></div>
</section>

<script>
  async function initDashboardAdaptive() {
    var session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    var activeClassId = sessionStorage.getItem('SIMKEL_ACTIVE_CLASS_ID') || '';
    var kpiBox = document.getElementById('dashboard-kpi-container');
    var extraBox = document.getElementById('dashboard-extra-container');
    var titleEl = document.getElementById('dash-title');
    var descEl = document.getElementById('dash-desc');
    var badgeSlot = document.getElementById('dash-badge-slot');

    try {
      var res = await postGAS({
        action: 'getDashboardData',
        user_id: session.user_id,
        class_id: activeClassId
      });

      if (res.status !== 'success') {
        kpiBox.innerHTML = '<div class="col-12"><div class="alert alert-danger py-2 small">' + res.message + '</div></div>';
        return;
      }

      var roleView = res.role_view;
      var d = res.data;

      // ================= 1. VIEW SISWA =================
      if (roleView === 'SISWA') {
        titleEl.innerText = 'Selamat Datang, ' + d.nama;
        descEl.innerText = 'NIS: ' + d.nis + ' | Rekap kehadiran dan catatan kedisiplinan pribadi Anda.';
        badgeSlot.innerHTML = '<span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">Akun Siswa</span>';

        var rate = d.kehadiran.total > 0 ? Math.round((d.kehadiran.hadir / d.kehadiran.total) * 100) : 100;

        kpiBox.innerHTML = '' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-success border-4">' +
              '<small class="text-muted fw-semibold">Kehadiran Saya</small>' +
              '<h3 class="fw-bold my-1 text-success">' + rate + '%</h3>' +
              '<small class="text-muted">' + d.kehadiran.hadir + ' dari ' + d.kehadiran.total + ' pertemuan</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-warning border-4">' +
              '<small class="text-muted fw-semibold">Izin & Sakit</small>' +
              '<h3 class="fw-bold my-1 text-warning">' + (d.kehadiran.sakit + d.kehadiran.izin) + '</h3>' +
              '<small class="text-muted">S:' + d.kehadiran.sakit + ' | I:' + d.kehadiran.izin + '</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-danger border-4">' +
              '<small class="text-muted fw-semibold">Poin Pelanggaran</small>' +
              '<h3 class="fw-bold my-1 text-danger">' + d.poin_disiplin + '</h3>' +
              '<small class="text-muted">Early Warning: ' + (d.poin_disiplin >= 25 ? 'Perhatian' : 'Aman') + '</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-primary border-4">' +
              '<small class="text-muted fw-semibold">Jadwal Piket</small>' +
              '<h5 class="fw-bold my-2 text-primary">' + d.jadwal_piket + '</h5>' +
              '<small class="badge ' + (d.piket_hari_ini ? 'bg-danger' : 'bg-light text-secondary border') + '">' + (d.piket_hari_ini ? 'Hari ini jadwal Anda!' : 'Bukan hari ini') + '</small>' +
            '</div>' +
          '</div>';

        extraBox.innerHTML = '';
        return;
      }

      // ================= 2. VIEW KURIKULUM (GLOBAL SEKOLAH) =================
      if (roleView === 'KURIKULUM_GLOBAL') {
        titleEl.innerText = 'Dashboard Pusat Kurikulum';
        descEl.innerText = 'Monitoring makro seluruh kelas dan administrasi kependudukan sekolah.';
        badgeSlot.innerHTML = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2">Koordinator Kurikulum</span>';

        kpiBox.innerHTML = '' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-primary border-4">' +
              '<small class="text-muted fw-semibold">Total Ruang Kelas</small>' +
              '<h3 class="fw-bold my-1 text-dark">' + d.total_kelas + '</h3>' +
              '<small class="text-muted">Aktif semester ini</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-info border-4">' +
              '<small class="text-muted fw-semibold">Total Siswa Terdaftar</small>' +
              '<h3 class="fw-bold my-1 text-dark">' + d.total_siswa + '</h3>' +
              '<small class="text-muted">Siswa di semua kelas</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-success border-4">' +
              '<small class="text-muted fw-semibold">Presensi Hadir Hari Ini</small>' +
              '<h3 class="fw-bold my-1 text-success">' + d.hadir_hari_ini + '</h3>' +
              '<small class="text-muted">Tercatat masuk sekolah</small>' +
            '</div>' +
          '</div>' +
          '<div class="col-md-3 col-6">' +
            '<div class="card card-kpi border-start border-warning border-4">' +
              '<small class="text-muted fw-semibold">Akumulasi Kas Seluruh Kelas</small>' +
              '<h3 class="fw-bold my-1 text-warning">Rp ' + Number(d.total_kas_seluruh_kelas).toLocaleString('id-ID') + '</h3>' +
              '<small class="text-muted">Total kas aktif</small>' +
            '</div>' +
          '</div>';

        extraBox.innerHTML = '' +
          '<div class="col-12">' +
            '<div class="card card-kpi">' +
              '<h6 class="fw-bold text-primary mb-2"><i class="fa-solid fa-list-check me-2"></i>Petunjuk Pemantauan Kurikulum</h6>' +
              '<p class="small text-muted mb-0">Untuk memantau aktivitas, nilai, absensi, atau jurnal dari kelas tertentu secara mendalam, silakan <strong>pilih kelas melalui menu dropdown di kanan atas</strong>.</p>' +
            '</div>' +
          '</div>';
        return;
      }

      // ================= 3. VIEW WALI KELAS / KURIKULUM PER KELAS =================
      titleEl.innerText = 'Dashboard Kelas: ' + d.nama_kelas;
      descEl.innerText = 'Statistik operasional harian, presensi, dan kedisiplinan siswa.';
      badgeSlot.innerHTML = '<span class="badge bg-primary px-3 py-2">' + (roleView === 'KURIKULUM_KELAS' ? 'Monitoring Kurikulum' : 'Wali Kelas') + '</span>';

      kpiBox.innerHTML = '' +
        '<div class="col-md-3 col-6">' +
          '<div class="card card-kpi border-start border-primary border-4">' +
            '<small class="text-muted fw-semibold">Jumlah Siswa Kelas</small>' +
            '<h3 class="fw-bold my-1 text-dark">' + d.total_siswa + '</h3>' +
            '<small class="text-muted">Siswa aktif</small>' +
          '</div>' +
        '</div>' +
        '<div class="col-md-3 col-6">' +
          '<div class="card card-kpi border-start border-success border-4">' +
            '<small class="text-muted fw-semibold">Hadir Hari Ini</small>' +
            '<h3 class="fw-bold my-1 text-success">' + d.hadir_hari_ini + '</h3>' +
            '<small class="text-muted">Dari ' + d.total_siswa + ' siswa</small>' +
          '</div>' +
        '</div>' +
        '<div class="col-md-3 col-6">' +
          '<div class="card card-kpi border-start border-danger border-4">' +
            '<small class="text-muted fw-semibold">Perlu Perhatian (EWS)</small>' +
            '<h3 class="fw-bold my-1 text-danger">' + d.perlu_perhatian + '</h3>' +
            '<small class="text-muted">Poin >= 25 atau Alfa >= 3</small>' +
          '</div>' +
        '</div>' +
        '<div class="col-md-3 col-6">' +
          '<div class="card card-kpi border-start border-warning border-4">' +
            '<small class="text-muted fw-semibold">Saldo Kas Kelas</small>' +
            '<h3 class="fw-bold my-1 text-warning">Rp ' + Number(d.saldo_kas).toLocaleString('id-ID') + '</h3>' +
            '<small class="text-muted">Kas kelas aktif</small>' +
          '</div>' +
        '</div>';

      extraBox.innerHTML = '' +
        '<div class="col-12">' +
          '<div class="card card-kpi bg-light border-0">' +
            '<div class="d-flex align-items-center justify-content-between">' +
              '<div>' +
                '<h6 class="fw-bold mb-1 text-dark"><i class="fa-solid fa-broom me-2 text-primary"></i>Petugas Piket Kebersihan Hari Ini</h6>' +
                '<small class="text-muted">Terdapat <strong>' + d.petugas_piket_hari_ini + '</strong> siswa terjadwal bertugas piket hari ini.</small>' +
              '</div>' +
              '<button class="btn btn-outline-primary btn-sm" onclick="navigateModule(\'piket\')">Buka Jadwal Piket</button>' +
            '</div>' +
          '</div>' +
        '</div>';

    } catch (err) {
      kpiBox.innerHTML = '<div class="col-12"><div class="alert alert-danger py-2 small">Gagal memuat statistik dashboard.</div></div>';
    }
  }

  initDashboardAdaptive();
</script>
