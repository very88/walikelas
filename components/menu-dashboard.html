<section id="panel-dashboard">
  <!-- Header Card Dinamis -->
  <div id="dash-header-box" class="mb-4">
    <div class="card p-3 border-0 bg-white rounded-3 shadow-sm">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
          <h5 class="fw-bold mb-1 text-dark" id="dash-title">Ringkasan Dashboard</h5>
          <small class="text-muted" id="dash-desc">Memuat data analisis...</small>
        </div>
        <div id="dash-badge-slot"></div>
      </div>
    </div>
  </div>

  <!-- Konten Utama Dashboard (Bercabang Berdasarkan Tipe) -->
  <div id="dash-content-area">
    <div class="text-center py-5 text-muted">
      <div class="spinner-border spinner-border-sm text-primary me-2"></div>Memproses data akurat...
    </div>
  </div>
</section>

<script>
  async function renderDashboardUnified() {
    var session = JSON.parse(sessionStorage.getItem('SIMKEL_SESSION') || '{}');
    var activeClassId = (sessionStorage.getItem('SIMKEL_ACTIVE_CLASS_ID') || '').toString().trim();
    var contentArea = document.getElementById('dash-content-area');
    var titleEl = document.getElementById('dash-title');
    var descEl = document.getElementById('dash-desc');
    var badgeSlot = document.getElementById('dash-badge-slot');

    try {
      var res = await postGAS({
        action: 'getDashboardData',
        user_id: session.user_id,
        class_id: activeClassId
      });

      if (res.status !== 'success') {
        contentArea.innerHTML = '<div class="alert alert-danger py-2 small">' + res.message + '</div>';
        return;
      }

      var type = res.dashboard_type;
      var d = res.data;

      // ========================================================
      // 1. TAMPILAN DASHBOARD EKSEKUTIF KURIKULUM (GLOBAL SEKOLAH)
      // ========================================================
      if (type === 'KURIKULUM_GLOBAL') {
        titleEl.innerHTML = '<i class="fa-solid fa-school text-danger me-2"></i>Dashboard Utama Kurikulum';
        descEl.innerText = 'Pemantauan komprehensif seluruh rombongan belajar dan administrasi sekolah.';
        badgeSlot.innerHTML = '<span class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2">Tingkat Sekolah (Makro)</span>';

        var rowsHtml = '';
        if (d.rekap_rombel && d.rekap_rombel.length > 0) {
          d.rekap_rombel.forEach(function(r, idx) {
            rowsHtml += '' +
              '<tr>' +
                '<td class="text-center">' + (idx + 1) + '</td>' +
                '<td class="fw-bold text-dark">' + r.nama_kelas + '</td>' +
                '<td><span class="badge bg-secondary">' + r.tingkat + '</span></td>' +
                '<td>' + r.nama_wali + '</td>' +
                '<td class="text-center">' + r.total_siswa + ' Siswa</td>' +
                '<td class="text-center">' +
                  '<span class="fw-semibold text-success">' + r.hadir_hari_ini + '</span> / ' + r.total_siswa +
                  ' <small class="text-muted">(' + r.persentase_hadir + '%)</small>' +
                '</td>' +
                '<td class="text-center">' +
                  '<button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="inspeksiKelas(\'' + r.class_id + '\')">' +
                    '<i class="fa-solid fa-arrow-up-right-from-square me-1"></i>Inspeksi Kelas' +
                  '</button>' +
                '</td>' +
              '</tr>';
          });
        } else {
          rowsHtml = '<tr><td colspan="7" class="text-center text-muted py-3">Belum ada ruang kelas yang terdaftar.</td></tr>';
        }

        contentArea.innerHTML = '' +
          '<div class="row g-3 mb-4">' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-danger border-4">' +
                '<small class="text-muted fw-semibold">Total Ruang Kelas</small>' +
                '<h3 class="fw-bold my-1 text-dark">' + d.total_kelas + '</h3>' +
                '<small class="text-muted">Rombel aktif</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-primary border-4">' +
                '<small class="text-muted fw-semibold">Total Siswa Terdaftar</small>' +
                '<h3 class="fw-bold my-1 text-dark">' + d.total_siswa + '</h3>' +
                '<small class="text-muted">Di seluruh kelas</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-success border-4">' +
                '<small class="text-muted fw-semibold">Kehadiran Hari Ini</small>' +
                '<h3 class="fw-bold my-1 text-success">' + d.persentase_sekolah + '%</h3>' +
                '<small class="text-muted">' + d.hadir_hari_ini + ' siswa hadir</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-warning border-4">' +
                '<small class="text-muted fw-semibold">Akumulasi Kas Seluruh Kelas</small>' +
                '<h3 class="fw-bold my-1 text-warning">Rp ' + Number(d.total_kas_sekolah).toLocaleString('id-ID') + '</h3>' +
                '<small class="text-muted">Total dana kelas</small>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="card card-kpi">' +
            '<div class="d-flex justify-content-between align-items-center mb-3">' +
              '<h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-chalkboard-user me-2 text-primary"></i>Status Seluruh Rombongan Belajar (Rombel)</h6>' +
              '<small class="text-muted">Data real-time kehadiran hari ini</small>' +
            '</div>' +
            '<div class="table-responsive">' +
              '<table class="table table-hover align-middle">' +
                '<thead class="table-dark">' +
                  '<tr>' +
                    '<th style="width: 45px;" class="text-center">No</th>' +
                    '<th>Nama Kelas</th>' +
                    '<th>Tingkat</th>' +
                    '<th>Wali Kelas</th>' +
                    '<th class="text-center">Total Siswa</th>' +
                    '<th class="text-center">Kehadiran Hari Ini</th>' +
                    '<th class="text-center" style="width: 150px;">Aksi</th>' +
                  '</tr>' +
                </thead>' +
                '<tbody>' + rowsHtml + '</tbody>' +
              '</table>' +
            '</div>' +
          '</div>';

        return;
      }

      // ========================================================
      // 2. TAMPILAN DASHBOARD OPERASIONAL KELAS (WALI KELAS & KURIKULUM PER-KELAS)
      // ========================================================
      if (type === 'OPERASIONAL_KELAS') {
        var isKurikulum = (session.role === 'KURIKULUM' || session.role === 'ADMIN');
        titleEl.innerHTML = '<i class="fa-solid fa-chalkboard text-primary me-2"></i>Dashboard Kelas: ' + d.nama_kelas;
        descEl.innerHTML = 'Wali Kelas: <strong>' + d.wali_kelas + '</strong> &bull; Total Siswa: <strong>' + d.total_siswa + '</strong>';
        badgeSlot.innerHTML = '<span class="badge ' + (isKurikulum ? 'bg-danger' : 'bg-primary') + ' px-3 py-2">' + (isKurikulum ? 'Inspeksi Kurikulum' : 'Wali Kelas') + '</span>';

        var piketListStr = (d.piket_hari_ini && d.piket_hari_ini.length > 0) 
          ? d.piket_hari_ini.join(', ') 
          : '<span class="text-muted fst-italic">Tidak ada jadwal piket tercatat hari ini</span>';

        var ewsRows = '';
        if (d.siswa_perhatian && d.siswa_perhatian.length > 0) {
          d.siswa_perhatian.forEach(function(s) {
            ewsRows += '<li><strong>' + s.nama + '</strong> (NIS: ' + s.nis + ') &mdash; <span class="text-danger fw-semibold">Poin: ' + s.poin + '</span> | Alfa: ' + s.alfa + ' hari</li>';
          });
        } else {
          ewsRows = '<li class="text-muted fst-italic">Kondusif: Tidak ada siswa dengan peringatan disiplin/alfa tinggi.</li>';
        }

        contentArea.innerHTML = '' +
          '<div class="row g-3 mb-4">' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-primary border-4">' +
                '<small class="text-muted fw-semibold">Siswa di Kelas Ini</small>' +
                '<h3 class="fw-bold my-1 text-dark">' + d.total_siswa + '</h3>' +
                '<small class="text-muted">Terdaftar aktif</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-success border-4">' +
                '<small class="text-muted fw-semibold">Hadir Hari Ini</small>' +
                '<h3 class="fw-bold my-1 text-success">' + d.kehadiran_hari_ini.hadir + ' <small class="fs-6 text-muted">(' + d.kehadiran_hari_ini.persen + '%)</small></h3>' +
                '<small class="text-muted">S:' + d.kehadiran_hari_ini.sakit + ' | I:' + d.kehadiran_hari_ini.izin + ' | A:' + d.kehadiran_hari_ini.alfa + '</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-danger border-4">' +
                '<small class="text-muted fw-semibold">Perlu Perhatian (EWS)</small>' +
                '<h3 class="fw-bold my-1 text-danger">' + d.perlu_perhatian_count + '</h3>' +
                '<small class="text-muted">Poin >= 25 atau Alfa >= 3</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-3 col-6">' +
              '<div class="card card-kpi border-start border-warning border-4">' +
                '<small class="text-muted fw-semibold">Saldo Kas Kelas Ini</small>' +
                '<h3 class="fw-bold my-1 text-warning">Rp ' + Number(d.saldo_kas).toLocaleString('id-ID') + '</h3>' +
                '<small class="text-muted">Kas kelas ' + d.nama_kelas + '</small>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="row g-3">' +
            '<div class="col-md-7">' +
              '<div class="card card-kpi h-100">' +
                '<h6 class="fw-bold text-danger mb-2"><i class="fa-solid fa-triangle-exclamation me-2"></i>Daftar Siswa Perlu Perhatian (EWS)</h6>' +
                '<ul class="small mb-0 ps-3">' + ewsRows + '</ul>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-5">' +
              '<div class="card card-kpi h-100 bg-light border-0">' +
                '<h6 class="fw-bold text-dark mb-2"><i class="fa-solid fa-broom me-2 text-primary"></i>Petugas Piket Hari Ini</h6>' +
                '<div class="small text-secondary mb-3">' + piketListStr + '</div>' +
                '<button class="btn btn-outline-primary btn-sm mt-auto w-100" onclick="navigateModule(\'piket\')">Buka Jadwal Piket</button>' +
              '</div>' +
            '</div>' +
          '</div>';

        return;
      }

      // ========================================================
      // 3. TAMPILAN DASHBOARD KELAS UNTUK SISWA (+ KARTU PRIBADI)
      // ========================================================
      if (type === 'OPERASIONAL_SISWA') {
        var p = d.personal || {};
        var myPres = p.kehadiran || { hadir: 0, sakit: 0, izin: 0, alfa: 0, total: 0 };
        var ratePribadi = myPres.total > 0 ? Math.round((myPres.hadir / myPres.total) * 100) : 100;

        titleEl.innerHTML = '<i class="fa-solid fa-graduation-cap text-success me-2"></i>Ruang Kelas: ' + d.nama_kelas;
        descEl.innerHTML = 'Halo, <strong>' + (p.nama || 'Siswa') + '</strong> (NIS: ' + (p.nis || '-') + ') &bull; Wali Kelas: <strong>' + d.wali_kelas + '</strong>';
        badgeSlot.innerHTML = '<span class="badge bg-success px-3 py-2">Siswa ' + d.nama_kelas + '</span>';

        var piketHariIniStr = (d.piket_hari_ini && d.piket_hari_ini.length > 0)
          ? d.piket_hari_ini.join(', ')
          : '<span class="text-muted fst-italic">Tidak ada jadwal piket kelas hari ini</span>';

        contentArea.innerHTML = '' +
          '<!-- Bagian 1: Ringkasan Pribadi Siswa -->' +
          '<div class="card card-kpi mb-4 bg-light border-0">' +
            '<div class="d-flex align-items-center justify-content-between mb-2">' +
              '<h6 class="fw-bold text-dark mb-0"><i class="fa-solid fa-user-check me-2 text-primary"></i>Status Kehadiran & Catatan Saya</h6>' +
              '<span class="badge ' + (p.piket_hari_ini ? 'bg-danger' : 'bg-secondary') + '">' + (p.piket_hari_ini ? 'Hari ini jadwal piket Anda!' : 'Jadwal Piket: ' + p.jadwal_piket) + '</span>' +
            '</div>' +
            '<div class="row g-2 text-center">' +
              '<div class="col-md-3 col-6">' +
                '<div class="p-2 border rounded bg-white">' +
                  '<small class="text-muted d-block">Presensi Pribadi</small>' +
                  '<strong class="text-success fs-5">' + ratePribadi + '%</strong>' +
                  '<small class="d-block text-muted">(' + myPres.hadir + ' dari ' + myPres.total + ' hari)</small>' +
                '</div>' +
              '</div>' +
              '<div class="col-md-3 col-6">' +
                '<div class="p-2 border rounded bg-white">' +
                  '<small class="text-muted d-block">Sakit & Izin</small>' +
                  '<strong class="text-warning fs-5">' + (myPres.sakit + myPres.izin) + '</strong>' +
                  '<small class="d-block text-muted">(S:' + myPres.sakit + ' | I:' + myPres.izin + ')</small>' +
                '</div>' +
              '</div>' +
              '<div class="col-md-3 col-6">' +
                '<div class="p-2 border rounded bg-white">' +
                  '<small class="text-muted d-block">Alfa / Tanpa Ket.</small>' +
                  '<strong class="text-danger fs-5">' + myPres.alfa + '</strong>' +
                  '<small class="d-block text-muted">Hari</small>' +
                '</div>' +
              '</div>' +
              '<div class="col-md-3 col-6">' +
                '<div class="p-2 border rounded bg-white">' +
                  '<small class="text-muted d-block">Poin Disiplin</small>' +
                  '<strong class="' + (p.poin_disiplin >= 25 ? 'text-danger' : 'text-primary') + ' fs-5">' + p.poin_disiplin + '</strong>' +
                  '<small class="d-block text-muted">Status: ' + (p.poin_disiplin >= 25 ? 'Peringatan' : 'Aman') + '</small>' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<!-- Bagian 2: Statistik Operasional Kelas Aktif -->' +
          '<h6 class="fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.8rem; letter-spacing: 0.5px;"><i class="fa-solid fa-users me-1"></i>Kondisi Kelas ' + d.nama_kelas + '</h6>' +
          '<div class="row g-3 mb-3">' +
            '<div class="col-md-4 col-12">' +
              '<div class="card card-kpi border-start border-primary border-4">' +
                '<small class="text-muted fw-semibold">Teman Sekelas</small>' +
                '<h4 class="fw-bold my-1 text-dark">' + d.total_siswa + ' Siswa</h4>' +
                '<small class="text-muted">Kelas ' + d.nama_kelas + '</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-4 col-6">' +
              '<div class="card card-kpi border-start border-success border-4">' +
                '<small class="text-muted fw-semibold">Kehadiran Kelas Hari Ini</small>' +
                '<h4 class="fw-bold my-1 text-success">' + d.kehadiran_hari_ini.hadir + ' Hadir</h4>' +
                '<small class="text-muted">' + d.kehadiran_hari_ini.persen + '% siswa masuk hari ini</small>' +
              '</div>' +
            '</div>' +
            '<div class="col-md-4 col-6">' +
              '<div class="card card-kpi border-start border-warning border-4">' +
                '<small class="text-muted fw-semibold">Saldo Kas Kelas</small>' +
                '<h4 class="fw-bold my-1 text-warning">Rp ' + Number(d.saldo_kas).toLocaleString('id-ID') + '</h4>' +
                '<small class="text-muted">Kas bersama kelas</small>' +
              '</div>' +
            '</div>' +
          '</div>' +

          '<div class="card card-kpi bg-light border-0">' +
            '<h6 class="fw-bold text-dark mb-1"><i class="fa-solid fa-broom me-2 text-primary"></i>Petugas Piket Kelas Hari Ini (' + new Date().toLocaleDateString('id-ID', { weekday: 'long' }) + ')</h6>' +
            '<p class="small text-secondary mb-0">' + piketHariIniStr + '</p>' +
          '</div>';
      }

    } catch (err) {
      contentArea.innerHTML = '<div class="alert alert-danger py-2 small">Gagal memuat visualisasi dashboard: ' + err.toString() + '</div>';
    }
  }

  function inspeksiKelas(targetClassId) {
    var select = document.getElementById('select-active-class');
    if (select) {
      select.value = targetClassId;
      gantiKelasAktif(targetClassId);
    }
  }

  renderDashboardUnified();
</script>
